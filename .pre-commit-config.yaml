# Solo afecta al paquete de ETLs (backend/etls). pre-commit ejecuta los hooks desde la raíz del
# repositorio, por eso las rutas de configuración son relativas a ella.
#   pre-commit run --all-files
files: ^backend/etls/
repos:
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        args: [--config=backend/etls/pyproject.toml]
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--settings-path=backend/etls]
  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        args: [--config=backend/etls/.flake8]
