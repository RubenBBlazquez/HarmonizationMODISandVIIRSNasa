<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Incendios · TerraMatch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { font-family: 'DM Sans', sans-serif; color: #17241f; background: #f5f7f4; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 1400px; margin: 0 auto; padding: 24px 32px 48px; }
    a { color: #2f5d43; }
    .back { font-size: 12px; }
    h1 { font: 700 clamp(22px, 2.6vw, 30px) Manrope, sans-serif; letter-spacing: -1px; margin: 10px 0 6px; }
    .criteria { color: #5d6d63; font-size: 13px; margin: 0 0 10px; }
    .help { background: #f2f7ee; color: #45603f; border-radius: 9px; padding: 10px 12px; font-size: 12px; line-height: 1.5; margin: 0 0 14px; }
    .status { color: #6d7b72; font-size: 12px; margin: 0 0 14px; }
    @media (max-width: 650px) { main { padding: 18px 16px 40px; } }
  </style>
</head>
<body>
  <main>
    <a class="back" href="/">← Volver al mapa</a>
    <h1 id="page-title">Incendios</h1>
    <p class="criteria" id="criteria"></p>
    <p class="help" id="help"></p>
    <p class="status" id="status">Cargando…</p>
    <table class="summary" id="summary" hidden></table>
    <section class="grid" id="grid" aria-label="Incendios"></section>
  </main>
  <script type="module" src="/src/fires.ts"></script>
</body>
</html>
