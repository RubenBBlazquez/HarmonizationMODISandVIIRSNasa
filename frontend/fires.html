<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Incendios · Siachi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    /* Misma estética que el globo y el histórico (fireCards.css). */
    :root { font-family: 'DM Sans', sans-serif; color: #121c2b; background: #f2f5f9; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 1400px; margin: 0 auto; padding: 24px 32px 48px; }
    a { color: #e2603a; }
    .back { display: inline-flex; gap: 6px; font-size: 12px; font-weight: 700; text-decoration: none; }
    .back:hover { text-decoration: underline; }
    h1 { font: 800 clamp(22px, 2.6vw, 30px) Manrope, sans-serif; letter-spacing: -1px; margin: 10px 0 14px; }
    .criteria { color: #66758a; font-size: 13px; margin: 0 0 10px; }
    .help { background: #fff; border: 1px solid #e4e9f0; color: #44546a; border-radius: 16px; padding: 12px 14px; font-size: 12px; line-height: 1.55; margin: 0 0 14px; }
    .status { color: #66758a; font-size: 12px; margin: 0 0 14px; }
    [hidden] { display: none !important; }
    @media (max-width: 650px) { main { padding: 18px 16px 40px; } }
  </style>
</head>
<body>
  <main>
    <a class="back" href="/">← Volver al mapa</a>
    <h1 id="page-title">Incendios</h1>
    <p class="criteria" id="criteria"></p>
    <p class="help" id="help"></p>
    <p class="status" id="status">Cargando…</p>
    <div class="history" id="history" hidden></div>
    <section class="grid" id="grid" aria-label="Incendios"></section>
  </main>
  <script type="module" src="/src/fires.ts"></script>
</body>
</html>
