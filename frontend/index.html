  <style>
    /* Mapa a pantalla completa; la actividad reciente flota encima como un panel plegable. */
    body { overflow: hidden; }
    .map { position: fixed; inset: 0; width: auto; height: auto; border-radius: 0; margin: 0; }
    .activity-panel { position: fixed; z-index: 1000; top: 12px; right: 12px; bottom: 12px; width: 340px; max-width: calc(100vw - 24px); display: flex; flex-direction: column; background: rgba(255,255,255,.96); border: 1px solid #dfe7dc; border-radius: 12px; box-shadow: 0 6px 24px #263c2933; transition: transform .25s ease, opacity .25s ease; }
    .activity-panel.collapsed { transform: translateX(calc(100% + 24px)); opacity: 0; pointer-events: none; }
    .activity-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; padding: 14px 14px 10px; border-bottom: 1px solid #edf0eb; }
    .activity-title { font: 700 15px Manrope, sans-serif; letter-spacing: -.3px; }
    .activity-sub { font-size: 11px; color: #6d7b72; margin-top: 2px; }
    .history-btn { flex: none; display: flex; align-items: center; gap: 4px; padding: 6px 8px 6px 10px; border: 1px solid #d9e2d6; background: #f4f7f2; color: #2f4a39; border-radius: 8px; font-size: 11px; font-weight: 600; }
    .history-btn:hover { background: #e9f0e5; }
    .activity-list { list-style: none; margin: 0; padding: 6px; overflow-y: auto; flex: 1; }
    .activity-empty { padding: 14px; font-size: 12px; color: #6d7b72; }
    .activity-item { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 9px 10px; border-radius: 8px; font: inherit; color: inherit; }
    .activity-item:hover { background: #f0f4ee; }
    .activity-item-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: #26362c; }
    .activity-item-meta { margin-top: 3px; font-size: 11px; color: #6d7b72; }
    .activity-badge { font-size: 10px; font-weight: 700; border-radius: 99px; padding: 2px 8px; background: #eef1ee; color: #5b6b62; }
    .activity-badge.active { background: #fbe9e6; color: #b03a28; }
    .activity-reopen { position: fixed; z-index: 1000; top: 16px; right: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 7px; border: 1px solid #dfe7dc; border-right: 0; border-radius: 12px 0 0 12px; background: rgba(255,255,255,.96); color: #2f5d43; box-shadow: -2px 2px 12px #263c2933; transition: background .15s ease, padding .15s ease; }
    .activity-reopen[hidden] { display: none; }
    .activity-reopen:hover, .activity-reopen:focus-visible { background: #2f5d43; color: #fff; padding-right: 11px; }
    .activity-reopen-label { writing-mode: vertical-rl; font-size: 11px; font-weight: 600; letter-spacing: .4px; white-space: nowrap; }
    /* Los controles de la derecha del mapa se apartan del panel mientras está abierto. */
    .leaflet-right { transition: right .25s ease; }
    body.activity-open .leaflet-right { right: 364px; }
    @media (max-width: 650px) { body.activity-open .leaflet-right { right: 0; } .activity-panel { width: calc(100vw - 24px); top: auto; height: 45vh; } }
    /* El mapa real (Leaflet) sustituye al dibujo decorativo. */
    .map:before, .map:after { display: none; }
    .map { background: #e7eee2; }
    .filters-control, .legend-control { background: rgba(255,255,255,.95); border: 1px solid #dfe7dc; border-radius: 8px; box-shadow: 0 2px 8px #263c291c; color: #405247; font-size: 11px; line-height: 1.5; padding: 10px 12px; }
    .filters-control { display: grid; gap: 6px; min-width: 190px; }
    .filters-control label { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    /* Selector de rango de fechas (un solo elemento). */
    .date-field { display: grid; gap: 3px; }
    .date-range { position: relative; }
    .date-range-toggle { width: 100%; display: flex; align-items: center; gap: 6px; text-align: left; border: 1px solid #d9e2d6; background: #fff; border-radius: 6px; padding: 5px 8px; font-size: 11px; color: #26362c; white-space: nowrap; }
    .date-range-icon { flex: none; color: #4d7954; }
    .date-range-toggle:hover, .date-range-toggle[aria-expanded="true"] { border-color: #9fb898; background: #f7faf5; }
    .date-range-popover { position: absolute; top: calc(100% + 4px); left: 0; z-index: 1000; width: 540px; max-width: calc(100vw - 40px); background: #fff; border: 1px solid #dfe7dc; border-radius: 10px; box-shadow: 0 6px 20px #263c2933; padding: 10px; }
    .date-range-popover[hidden] { display: none; }
    .date-range-head { display: flex; gap: 4px; align-items: center; margin-bottom: 6px; }
    .date-range-head select { flex: 1; min-width: 0; font: inherit; font-size: 11px; border: 1px solid #e4e9e2; border-radius: 6px; padding: 3px; background: #fff; }
    .date-range-head .nav { border: 0; background: #f2f5f0; border-radius: 6px; width: 24px; height: 24px; color: #2f4a39; }
    .date-range-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px 0; }
    .date-range-grid .weekday { text-align: center; font-size: 10px; color: #8a978e; padding: 2px 0; }
    .date-range-grid .day { border: 0; background: none; border-radius: 6px; height: 28px; font-size: 11px; color: #26362c; }
    .date-range-grid .day:hover:not(:disabled) { background: #eef4ea; }
    .date-range-grid .day:disabled { color: #c3cbc5; cursor: default; }
    .date-range-grid .day.in-range { background: #e3eedd; border-radius: 0; }
    .date-range-grid .day.edge { background: #2f5d43; color: #fff; border-radius: 6px; }
    .date-range-panels { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .date-range-panel + .date-range-panel { border-left: 1px solid #edf0eb; padding-left: 14px; }
    .date-range-panel-title { display: grid; gap: 1px; margin-bottom: 6px; }
    .date-range-panel-title small { font-size: 9.5px; text-transform: uppercase; letter-spacing: .6px; color: #7d8a81; }
    .date-range-panel-title b { font-size: 13px; color: #2f5d43; }
    .date-range-note { margin: 8px 0 0; font-size: 10.5px; line-height: 1.4; color: #6d7b72; }
    .date-range-footer { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 8px; padding-top: 8px; border-top: 1px solid #edf0eb; }
    .date-range-done { border: 0; background: #2f5d43; color: #fff; border-radius: 6px; padding: 5px 12px; font-size: 11px; font-weight: 600; }
    .date-range-done:hover { background: #27503a; }
    @media (max-width: 640px) { .date-range-popover { width: 270px; } .date-range-panels { grid-template-columns: 1fr; } .date-range-panel + .date-range-panel { border-left: 0; padding-left: 0; border-top: 1px solid #edf0eb; padding-top: 10px; } }
    .date-range-presets { display: flex; flex-wrap: wrap; gap: 4px; }
    .date-range-presets button { border: 1px solid #e4e9e2; background: #fff; border-radius: 99px; padding: 3px 8px; font-size: 10.5px; color: #2f4a39; }
    .date-range-presets button:hover { background: #f2f7ee; }
    .filters-control .map-status { color: #5d6d63; border-top: 1px solid #edf0eb; padding-top: 6px; max-width: 230px; }
    .legend-control i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
    .legend-item { display: flex; align-items: center; width: 100%; border: 0; background: none; padding: 3px 4px; margin: 0; border-radius: 5px; font: inherit; color: inherit; text-align: left; cursor: pointer; }
    .legend-item:hover { background: #f0f4ee; }
    .legend-item i { flex: none; width: 11px; height: 11px; background: var(--c); border: 2px solid var(--c); box-sizing: border-box; }
    .legend-item[aria-pressed="false"] { color: #9aa49d; text-decoration: line-through; }
    .legend-item[aria-pressed="false"] i { background: transparent; }
    .legend-reset { margin-top: 4px; border: 1px solid #d9e2d6; background: #f4f7f2; color: #2f4a39; border-radius: 99px; padding: 2px 8px; font-size: 10.5px; cursor: pointer; }
    .legend-reset[hidden] { display: none; }
    /* Selección de zona y resultados. */
    .select-area { display: flex; align-items: center; gap: 8px; border: 1px solid #d9e2d6; background: #f4f7f2; color: #2f4a39; border-radius: 6px; padding: 6px 9px; font-size: 11px; font-weight: 600; text-align: left; }
    .select-area svg { flex: none; color: #e2603a; }
    .select-area span { flex: 1; }
    .select-area kbd { font: 600 9.5px 'DM Sans', sans-serif; border: 1px solid #c9d8c2; border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: #fff; color: #5d6d63; }
    .select-area:hover { background: #e9f0e5; }
    .select-area.active { background: #e2603a; border-color: #e2603a; color: #fff; }
    .select-area.active svg { color: #fff; }
    .selection-menu { display: grid; gap: 6px; min-width: 220px; font-size: 12px; }
    .selection-menu small { color: #6d7b72; }
    .selection-menu button { border: 1px solid #e4e9e2; background: #fff; border-radius: 6px; padding: 6px 8px; text-align: left; color: #26362c; font-size: 12px; }
    .selection-menu button:hover { background: #f2f7ee; border-color: #c9d8c2; }
    .results-control { width: 320px; max-height: 330px; overflow-y: auto; background: rgba(255,255,255,.97); border: 1px solid #dfe7dc; border-radius: 8px; box-shadow: 0 2px 8px #263c291c; color: #405247; font-size: 11px; line-height: 1.45; padding: 10px 12px; }
    .results-control[hidden] { display: none; }
    .results-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px; font-size: 12px; color: #26362c; }
    .results-close { border: 0; background: none; color: #6d7b72; font-size: 13px; }
    .results-body p { margin: 4px 0; }
    .results-table { width: 100%; border-collapse: collapse; margin: 6px 0; }
    .results-table th, .results-table td { padding: 3px 4px; text-align: right; border-bottom: 1px solid #f0f2ee; }
    .results-table th:first-child, .results-table td:first-child { text-align: left; }
    .results-table tr.reference td { background: #fdf0ea; font-weight: 600; }
    .results-list { margin: 4px 0 0; padding-left: 18px; }
    .results-help { color: #6d7b72; font-size: 10.5px; background: #f6f8f4; border-radius: 6px; padding: 5px 7px; }
    .open-tab { font-weight: 600; white-space: nowrap; }
    .results-list button { border: 0; background: none; padding: 2px 0; text-align: left; color: #2f5d43; font-size: 11px; }
    .results-list button:hover { text-decoration: underline; }
    .legend-control .legend-note { color: #6d7b72; border-top: 1px solid #edf0eb; margin-top: 6px; padding-top: 6px; max-width: 190px; }
    .legend-control div + div { margin-top: 3px; }
    .coordinates-control { background: rgba(255,255,255,.94); border: 1px solid #dfe7dc; border-radius: 8px; box-shadow: 0 2px 8px #263c291c; color: #405247; font-size: 11px; line-height: 1.55; padding: 9px 11px; min-width: 150px; }
  </style>
</head>
<body>
  <div class="map" aria-label="Mapa de incendios"></div>
  <aside class="activity-panel" id="activity-panel" aria-label="Actividad reciente">
    <header class="activity-head">
      <div><div class="activity-title">Actividad reciente</div>
        <div class="activity-sub" id="activity-sub">Últimos incendios registrados</div></div>
      <button type="button" class="history-btn" id="activity-hide" aria-label="Ocultar actividad reciente">
        <span>Ocultar</span>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 6l6 6-6 6"/><path d="M13 6l6 6-6 6"/></svg>
      </button>
    </header>
    <ol class="activity-list" id="activity-list"><li class="activity-empty">Cargando…</li></ol>
  </aside>
  <button type="button" class="activity-reopen" id="activity-show" aria-label="Mostrar actividad reciente" hidden>
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l3 2"/></svg>
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    <span class="activity-reopen-label">Actividad reciente</span>
  </button>
  <script type="module" src="/src/index.ts"></script>
</body>
</html>
