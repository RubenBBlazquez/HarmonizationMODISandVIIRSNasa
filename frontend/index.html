<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#02040a" />
  <title>Siachi · Incendios en el mundo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="globe" id="globe" aria-label="Globo terráqueo con los incendios: elige un país"></div>

  <!-- Panel de la izquierda: país, capas, fechas y herramientas. -->
  <aside class="globe-panel filters-control busy" aria-label="Filtros del mapa" aria-busy="true">
    <div class="globe-busy" aria-hidden="true"><span></span></div>
    <header class="globe-head">
      <div class="globe-brand"><span class="globe-mark" aria-hidden="true">◍</span>
        <div><b>Siachi</b><small>Incendios por país</small></div></div>
    </header>

    <section class="globe-country">
      <div class="globe-country-name" id="country-name">Cargando…</div>
      <p class="globe-country-note" id="country-note"></p>
      <button type="button" class="globe-link" id="world-btn">Ver el mundo entero y elegir otro país</button>
    </section>

    <label><span><input type="checkbox" id="layer-events" checked> Eventos</span></label>
    <label><span><input type="checkbox" id="layer-detections" checked> Detecciones válidas</span></label>
    <div class="date-field"><span>Fechas</span><div id="date-range"></div></div>
    <label class="months-option" for="all-years-months"
      title="Muestra el mismo rango de días (por ejemplo 12-18 ago) en cada año disponible">
      <input type="checkbox" id="all-years-months">
      <span><b>Comparar con todos los años</b>
        <small id="all-years-hint">Mismas fechas del rango en cada año</small></span>
    </label>
    <div class="years-legend" id="years-legend" hidden>
      <div class="years-title" title="Cada año se dibuja con el contorno de su color. Pulsa un año para ocultarlo o mostrarlo. Los totales son del país elegido. Evento = incendio (grupo de detecciones); detección = punto detectado por el satélite. El relleno indica la intensidad (FRP).">Color del contorno por año <span aria-hidden="true">ⓘ</span></div>
      <div class="years-chips"></div>
    </div>
    <button type="button" class="play-btn" id="play-btn"
      title="Muestra día a día cómo avanzan los incendios del rango elegido"></button>
    <button type="button" class="select-area" id="select-area"
      title="Dibuja un recuadro en el mapa. También: mantén Ctrl y arrastra"></button>
    <div class="map-status loading" id="map-status" aria-live="polite">Cargando…</div>
  </aside>

  <!-- Alertas (arriba, en el centro). -->
  <div class="alerts-control">
    <button type="button" class="alerts-toggle" aria-expanded="false">
      <span class="alerts-bell" aria-hidden="true">⚠</span><span class="alerts-count">0</span>
      <span>Alertas activas</span></button>
    <div class="alerts-list" hidden></div>
  </div>

  <!-- Incendio enfocado desde el histórico ("Ver en el globo"). -->
  <div class="focus-bar" id="focus-bar" role="status" hidden>
    <span class="focus-icon" aria-hidden="true">🔥</span>
    <div class="focus-text"><b id="focus-title"></b><small id="focus-sub"></small></div>
    <button type="button" class="focus-back" id="focus-back"></button>
    <button type="button" class="focus-close" id="focus-close"><span aria-hidden="true">✕</span> Quitar</button>
  </div>

  <!-- Leyenda interactiva (abajo a la derecha) y coordenadas del cursor (abajo a la izquierda). -->
  <div class="legend-control" id="legend"></div>
  <div class="coordinates-control" id="coordinates">Mueve el cursor sobre el mapa</div>

  <!-- Actividad reciente (derecha, plegable). -->
  <aside class="activity-panel" id="activity-panel" aria-label="Actividad reciente">
    <header class="activity-head">
      <div><div class="activity-title">Actividad reciente</div>
        <div class="activity-sub" id="activity-sub">Últimos incendios registrados</div></div>
      <button type="button" class="history-btn" id="activity-hide" aria-label="Ocultar actividad reciente">
        <span>Ocultar</span>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 6l6 6-6 6"/><path d="M13 6l6 6-6 6"/></svg>
      </button>
    </header>
    <ol class="activity-list" id="activity-list"><li class="activity-empty">Cargando…</li></ol>
  </aside>
  <button type="button" class="activity-reopen" id="activity-show" aria-label="Mostrar actividad reciente" hidden>
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l3 2"/></svg>
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    <span class="activity-reopen-label">Actividad reciente</span>
  </button>

  <script type="module" src="/src/globe.ts"></script>
</body>
</html>
