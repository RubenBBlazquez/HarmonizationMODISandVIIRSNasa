<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#02040a" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2714%27 fill=%27%231e4f93%27/%3E%3Ccircle cx=%2722%27 cy=%2711%27 r=%275%27 fill=%27%23e2603a%27/%3E%3C/svg%3E">
  <title>Siachi · Fires around the world</title>
  <!-- Estilos críticos incrustados: el CSS de la app lo importa el JS, y hasta que carga se vería
       el HTML sin estilos. La pantalla de carga usa el mismo fondo de espacio que el globo. -->
  <style>
    html, body { margin: 0; height: 100%; background: #02040a; }
    body { overflow: hidden; font-family: "DM Sans", system-ui, sans-serif; }
    /* Hasta que la app está lista solo se ve la pantalla de carga (los elementos siguen
       maquetados, así que el mapa mide bien su tamaño). */
    body:not(.app-ready) > :not(.splash):not(script) { visibility: hidden; }
    .splash {
      position: fixed; inset: 0; z-index: 10000; display: grid; place-content: center; justify-items: center; gap: 22px;
      color: #eef3fa; text-align: center;
      background-color: #02040a;
      background-image:
        radial-gradient(1px 1px at 12% 18%, #fff9, transparent),
        radial-gradient(1px 1px at 27% 72%, #fff7, transparent),
        radial-gradient(1.5px 1.5px at 41% 33%, #fffb, transparent),
        radial-gradient(1px 1px at 58% 88%, #fff8, transparent),
        radial-gradient(1px 1px at 66% 12%, #fff9, transparent),
        radial-gradient(1.5px 1.5px at 79% 57%, #fffa, transparent),
        radial-gradient(1px 1px at 88% 26%, #fff7, transparent),
        radial-gradient(1px 1px at 93% 81%, #fff8, transparent),
        radial-gradient(ellipse at 60% 45%, #0f2340 0, #02040a 70%);
      background-size: 230px 230px, 310px 310px, 270px 270px, 190px 190px, 350px 350px,
        250px 250px, 290px 290px, 210px 210px, 100% 100%;
      animation: splash-stars 40s linear infinite;
      transition: opacity .6s ease, visibility .6s ease;
    }
    .splash.done { opacity: 0; visibility: hidden; pointer-events: none; }
    @keyframes splash-stars { to { background-position: 230px 120px, -310px 90px, 270px -140px, -190px 160px, 350px 70px, -250px -110px, 290px 130px, -210px -90px, 0 0; } }
    .splash-globe {
      position: relative; width: 84px; height: 84px; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #5fa8ff 0, #1e4f93 45%, #0a1f3d 100%);
      box-shadow: 0 0 40px #3b82f655, inset -10px -10px 24px #00000066;
      animation: splash-float 3s ease-in-out infinite;
    }
    .splash-globe::before, .splash-globe::after {
      content: ""; position: absolute; inset: 0; border-radius: 50%;
      border: 1px solid #ffffff2e;
    }
    .splash-globe::before { transform: scaleX(.45); }
    .splash-globe::after { transform: scaleY(.45); }
    .splash-fire {
      position: absolute; right: 8px; top: 20px; width: 9px; height: 9px; border-radius: 50%;
      background: #e2603a; box-shadow: 0 0 0 0 #e2603a99; animation: splash-pulse 1.6s ease-out infinite;
    }
    @keyframes splash-float { 50% { transform: translateY(-8px); } }
    @keyframes splash-pulse { to { box-shadow: 0 0 0 16px #e2603a00; } }
    .splash-title { font: 800 26px Manrope, system-ui, sans-serif; letter-spacing: -.6px; }
    .splash-sub { margin-top: 4px; color: #a9b8cc; font-size: 13px; }
    .splash-bar { width: min(260px, 70vw); height: 4px; overflow: hidden; border-radius: 4px; background: #ffffff1c; }
    .splash-bar span {
      display: block; width: 40%; height: 100%; border-radius: 4px;
      background: linear-gradient(90deg, transparent, #e2603a 40%, #f2a33a 60%, transparent);
      animation: splash-bar 1.2s ease-in-out infinite;
    }
    @keyframes splash-bar { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) {
      .splash, .splash-globe, .splash-fire, .splash-bar span { animation-duration: 6s; }
    }
  </style>
  <link rel="preconnect" href="https://gibs.earthdata.nasa.gov" crossorigin>
  <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="splash" id="splash" role="status" aria-live="polite">
    <div class="splash-globe" aria-hidden="true"><span class="splash-fire"></span></div>
    <div><div class="splash-title">Siachi</div><div class="splash-sub">Loading fires around the world…</div></div>
    <div class="splash-bar" aria-hidden="true"><span></span></div>
  </div>
  <div class="globe" id="globe" aria-label="Globe with the fires: choose a country"></div>

  <!-- Panel de la izquierda: país, capas, fechas y herramientas. -->
  <aside class="globe-panel filters-control busy" aria-label="Map filters" aria-busy="true">
    <div class="globe-busy" aria-hidden="true"><span></span></div>
    <header class="globe-head">
      <div class="globe-brand"><span class="globe-mark" aria-hidden="true"><span class="globe-mark-fire"></span></span>
        <div><b>Siachi</b><small>Fires by country</small></div></div>
      <button type="button" class="panel-close" id="panel-close" aria-label="Hide filters" title="Hide filters">✕</button>
    </header>

    <section class="globe-country">
      <div class="globe-country-name" id="country-name">Loading…</div>
      <p class="globe-country-note" id="country-note"></p>
      <button type="button" class="globe-link" id="world-btn">View the whole world and choose another country</button>
    </section>

    <label><span><input type="checkbox" id="layer-events" checked> Events</span></label>
    <label><span><input type="checkbox" id="layer-detections" checked> Valid detections</span></label>
    <div class="date-field"><span>Dates</span><div id="date-range"></div></div>
    <label class="months-option" for="all-years-months"
      title="Shows the same range of days (for example 12-18 Aug) in every available year">
      <input type="checkbox" id="all-years-months">
      <span><b>Compare with all years</b>
        <small id="all-years-hint">Same dates of the range in each year</small></span>
    </label>
    <div class="years-legend" id="years-legend" hidden>
      <div class="years-title" title="Each year is drawn with its own outline colour. Click a year to hide or show it. Totals are for the chosen country. Event = fire (a group of detections); detection = a point detected by the satellite. The fill shows intensity (FRP).">Outline colour by year <span aria-hidden="true">ⓘ</span></div>
      <div class="years-chips"></div>
    </div>
    <button type="button" class="play-btn" id="play-btn"
      title="Shows day by day how the fires in the chosen range progress"></button>
    <button type="button" class="select-area" id="select-area"
      title="Draw a box on the map. Also: hold Ctrl and drag"></button>
    <div class="map-status loading" id="map-status" aria-live="polite">Loading…</div>
  </aside>
  <!-- Barra superior (en móvil: Filtros · Alertas · Leyenda; en escritorio no añade caja). -->
  <div class="mobile-bar">
    <!-- Filters button: opens the panel when it is hidden (on mobile it starts hidden). -->
    <button type="button" class="filters-fab" id="filters-fab" aria-label="Show filters" title="Show filters" hidden>
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18l-7 8.5V19l-4 2v-7.5z"/></svg>
      <span class="fab-label">Filters</span>
    </button>

    <!-- Alerts (top, centre on desktop). -->
    <div class="alerts-control">
      <button type="button" class="alerts-toggle" aria-expanded="false">
        <span class="alerts-bell" aria-hidden="true">⚠</span><span class="alerts-count">0</span>
        <span>Alerts</span></button>
      <div class="alerts-list" hidden></div>
    </div>

    <!-- Legend button (mobile only; on desktop the legend is always visible). -->
    <button type="button" class="legend-fab" id="legend-fab" aria-label="Show legend" title="Show legend" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg>
      <span class="fab-label">Legend</span>
    </button>
  </div>

  <!-- Fire focused from the history ("View on the globe"). -->
  <div class="focus-bar" id="focus-bar" role="status" hidden>
    <span class="focus-icon" aria-hidden="true">🔥</span>
    <div class="focus-text"><b id="focus-title"></b><small id="focus-sub"></small></div>
    <button type="button" class="focus-back" id="focus-back"></button>
    <button type="button" class="focus-close" id="focus-close"><span aria-hidden="true">✕</span> Remove</button>
  </div>

  <!-- Leyenda interactiva (abajo a la derecha) y coordenadas del cursor (abajo a la izquierda). -->
  <div class="legend-control" id="legend"></div>
  <div class="coordinates-control" id="coordinates">Move the cursor over the map</div>

  <!-- Actividad reciente (derecha, plegable). -->
  <aside class="activity-panel" id="activity-panel" aria-label="Recent activity">
    <header class="activity-head">
      <div><div class="activity-title">Recent activity</div>
        <div class="activity-sub" id="activity-sub">Latest recorded fires</div></div>
      <button type="button" class="history-btn" id="activity-hide" aria-label="Hide recent activity">
        <span>Hide</span>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 6l6 6-6 6"/><path d="M13 6l6 6-6 6"/></svg>
      </button>
    </header>
    <ol class="activity-list" id="activity-list"><li class="activity-empty">Loading…</li></ol>
  </aside>
  <button type="button" class="activity-reopen" id="activity-show" aria-label="Show recent activity" hidden>
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l3 2"/></svg>
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    <span class="activity-reopen-label">Recent activity</span>
  </button>

  <script type="module" src="/src/pages/globe.ts"></script>
</body>
</html>
