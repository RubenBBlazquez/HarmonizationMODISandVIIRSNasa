services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: harmonization-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: fires
      POSTGRES_USER: fires
      POSTGRES_PASSWORD: fires  # solo desarrollo local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./backend/databases/postgis/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: harmonization-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://fires:fires@postgis:5432/fires
    # Arranca el servidor de la API con recarga al editar backend/api (desarrollo).
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/backend/api
    ports:
      - "8000:8000"
    depends_on:
      postgis:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./backend/etls/data:/app/backend/etls/data:ro
      - ./backend/etls/config:/app/backend/etls/config:ro
      - etl_output:/app/backend/etls/output

  # Frontend (Vite + Leaflet): ejecuta `npm run dev`. El navegador llama a /api y Vite lo reenvía
  # a la API del contenedor `api`.
  frontend:
    image: node:22-alpine
    container_name: harmonization-frontend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      DEV_HOST: 0.0.0.0
      API_PROXY_TARGET: http://api:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  postgis_data:
  etl_output:
  frontend_node_modules:
