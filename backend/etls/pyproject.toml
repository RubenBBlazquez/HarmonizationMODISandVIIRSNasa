[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fire-etl"
version = "0.1.0"
description = "Fusión de detecciones de incendio MODIS + VIIRS (NASA FIRMS) en eventos consolidados"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "scipy>=1.11",
    "pyarrow>=14",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "pre-commit>=3.6"]
viz = ["matplotlib>=3.8"]

[project.scripts]
fire-etl = "fire_etl.pipeline:main"

[tool.setuptools.packages.find]
include = ["fire_etl*"]

[tool.black]
line-length = 99
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 99
known_first_party = ["_paths"]
known_local_folder = ["fire_etl", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
