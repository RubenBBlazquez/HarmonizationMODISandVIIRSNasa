# Bases de datos del proyecto. Uso:
#   cp .env.example .env   # y define credenciales propias
#   docker compose up -d
services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: harmonization-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: fires
      POSTGRES_USER: fires
      POSTGRES_PASSWORD: fires
    ports:
      # Solo accesible desde la propia máquina.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      # Los scripts solo se ejecutan al crear el volumen por primera vez.
      - ./postgis/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgis_data:
